# The metrics demo: an app sending traffic through the cache, plus Postgres, Prometheus and
# Grafana. From the repo root: pnpm build && docker compose -f examples/metrics/docker-compose.yml up
# then open http://localhost:3000.
services:
  app:
    image: node:24
    working_dir: /repo
    command: node examples/metrics/server.ts
    # Runs the built package from this checkout, so `pnpm build` must come first.
    volumes:
      - ../..:/repo:ro
    env_file:
      - path: ../../.env
        required: false
    environment:
      DEMO_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      # DEMO_OFFLINE=1 docker compose ... up: use the fakes even with OPENAI_API_KEY in .env.
      DEMO_OFFLINE: ${DEMO_OFFLINE:-}
    ports:
      - "9464:9464"
    depends_on:
      - postgres

  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dashboard.json
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      # The folder, not the file: a single-file bind mount keeps the old copy once an editor saves a new one.
      - ../../grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
