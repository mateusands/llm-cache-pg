name: Release

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs on every pull request with no secrets, so it is safe for forks: the whole publish path
  # except the upload.
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A unique prerelease version, so the dry run never collides with one already published.
      - run: npm version --no-git-tag-version "$(node -p "require('./package.json').version")-dryrun.${GITHUB_SHA::7}"
      - run: npm publish --dry-run --tag dryrun

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node test/consumer/smoke.mjs
      # Trusted publishing (OIDC) needs npm 11.5.1+; provenance is then generated automatically.
      - run: npm install -g npm@^11.5.1
      - run: npm publish --access public
      - name: GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
